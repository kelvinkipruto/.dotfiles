name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v26
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Flake check
        run: nix flake check
      - name: Build NixOS config
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            nix build .#nixosConfigurations.kelvinkipruto.config.system.build.toplevel && exit 0
            echo "Build failed (attempt $i). Retrying..."
            sleep 5
          done
          exit 1
